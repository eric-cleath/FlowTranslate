name: PallasOwl
options:
  bundleIdPrefix: com.flowtranslate
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: PallasOwl
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    MARKETING_VERSION: 0.9.3
    CURRENT_PROJECT_VERSION: 93
targets:
  PallasOwl:
    type: application
    platform: macOS
    sources:
      - FlowTranslate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowtranslate.app
        PRODUCT_NAME: PallasOwl
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FlowTranslate/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: FlowTranslate/FlowTranslate.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: PallasOwl 需要使用麦克风进行实时语音转写和翻译。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: PallasOwl 需要使用语音识别将实时声音转换为字幕。
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: PallasOwl 需要捕获所选应用或全部应用的系统音频，以生成实时字幕；不会保存屏幕画面。
        INFOPLIST_KEY_NSAudioCaptureUsageDescription: PallasOwl 需要读取所选应用的系统声音，以进行实时语音转写和翻译。
