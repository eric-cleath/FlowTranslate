name: PallasOwl
options:
  bundleIdPrefix: com.flowtranslate
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: PallasOwl
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    MARKETING_VERSION: 0.7.5
    CURRENT_PROJECT_VERSION: 75
targets:
  PallasOwl:
    type: application
    platform: macOS
    sources:
      - FlowTranslate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowtranslate.app
        PRODUCT_NAME: PallasOwl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: FlowTranslate/FlowTranslate.entitlements
